# Tests and tooling packages
[package]
name = "ic-auth-qualification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Internal IC Testkit and ingress-delegation qualification"

[dev-dependencies]
ic-auth = { workspace = true, features = ["sessions", "certified-proof-verification", "portable-signature-verification"] }
ic-auth-protocol-types.workspace = true
# Unpublished Wire controls for the qualification host.
ic-auth-qualification-contracts.workspace = true
ic-auth-wire.workspace = true
ic-host-fs.workspace = true
ic-host-process = { workspace = true, features = ["test-support"] }
ic-platform = { workspace = true, features = ["agent", "canister-sig-creation", "ecdsa", "ed25519", "pocket-ic"] }
ic-testkit = { workspace = true, features = ["wire"] }
ic-wire.workspace = true
serde.workspace = true
sha2.workspace = true
tokio.workspace = true

[lints]
workspace = true
