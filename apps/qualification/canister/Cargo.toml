# Tests and tooling packages
[package]
name = "ic-auth-qualification-canister"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Internal canister host for IC Auth qualification"

[lib]
crate-type = ["cdylib"]

[dependencies]
ic-auth = { workspace = true, features = ["canister-signature-preparation", "session-restore", "portable-signature-verification", "certified-proof-verification"] }
ic-auth-protocol-types.workspace = true
# Private Wire controls are never part of the public Auth contract.
ic-auth-qualification-contracts.workspace = true
ic-auth-wire.workspace = true
ic-memory = { workspace = true, features = ["test-support"] }
ic-platform = { workspace = true, features = ["bls", "cdk", "certification"] }
ic-wire.workspace = true
serde.workspace = true
# Private component probes decode the same IC certificate envelopes as Platform.
serde_bytes.workspace = true
serde_cbor.workspace = true
# The shared ../sessions.rs fixture hashes admitted Ed25519 key bindings.
sha2.workspace = true

[lints]
workspace = true
