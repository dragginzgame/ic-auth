# Tests and tooling packages
[package]
name = "ic-auth-tooling"
version = "0.33.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "IC Auth client-contract generation and external Cargo-lock admission"
publish = false

[dependencies]
clap.workspace = true
ic-auth-wire = { workspace = true, features = ["typescript"] }
ic-build.workspace = true
ic-host-fs.workspace = true
serde_json.workspace = true

[dev-dependencies]
dhat.workspace = true
ic-auth = { workspace = true, features = ["sessions", "portable-signature-verification"] }
ic-auth-protocol-types.workspace = true
ic-platform = { workspace = true, features = ["ed25519"] }

[lints]
workspace = true
