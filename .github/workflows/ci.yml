name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Prepare the repository-selected Rust toolchain
        run: rustup show active-toolchain
      - name: Install reviewed tools and prepare the selected dependency cache
        run: |
          make install-tools
          make tools-check
          echo "$GITHUB_WORKSPACE/.tools/host/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/.tools/ic/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/.tools/rust/bin" >> "$GITHUB_PATH"
          make fetch
      - name: Validate
        run: make ci
