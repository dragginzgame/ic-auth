name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer run replaces queued and running checks for this workflow and ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      VALIDATION_LOG_DIR: ${{ github.workspace }}/target/portable-fixtures/validation
      TMPDIR: ${{ github.workspace }}/target/portable-fixtures
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Prepare retained evidence directories
        run: mkdir -p target/portable-fixtures target/browser-client
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: packages/client/.nvmrc
          package-manager-cache: false
      - name: Prepare selected client package manager and locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/dev/prepare-client-ci.sh 2>&1 | tee target/browser-client/npm-preparation.log
      - name: Prepare the repository-selected Rust toolchain
        run: rustup show active-toolchain
      - name: Prepare host tools and identify Cargo build cache
        id: tool-cache-key
        run: |
          make --no-print-directory install-host-tools
          make --no-print-directory host-tools-check
          export PATH="$GITHUB_WORKSPACE/.tools/host/bin:$PATH"
          bash scripts/ci/cargo-tool-cache-key.sh ci/tool-versions.env >> "$GITHUB_OUTPUT"
      - name: Restore Cargo tool builds
        id: tool-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 3
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
        with:
          path: |
            ${{ steps.tool-cache-key.outputs.root }}/cargo-cache
            ${{ steps.tool-cache-key.outputs.root }}/rust-*
          key: cargo-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.tool-cache-key.outputs.key }}
      - name: Install reviewed tools and prepare the selected dependency cache
        run: |
          bash scripts/dev/ci-tools.sh install
          bash scripts/dev/ci-tools.sh check
          printf '%s\n' "$GITHUB_WORKSPACE/.tools/host/bin" \
            "$GITHUB_WORKSPACE/.tools/rust/common/bin" >> "$GITHUB_PATH"
          make fetch
      # Save after setup and admission, before longer tests can be cancelled.
      # Pull requests only restore; cache hits never bypass tool admission.
      - name: Save verified Cargo tool builds
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.tool-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: |
            ${{ steps.tool-cache-key.outputs.root }}/cargo-cache
            ${{ steps.tool-cache-key.outputs.root }}/rust-*
          key: cargo-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.tool-cache-key.outputs.key }}
      - name: Qualify Rust-tool setup and check failure collection
        id: tools-evidence
        run: bash scripts/ci/test-tools-evidence.sh
      - name: Upload the qualified Rust-tool failure evidence
        id: tools-evidence-upload
        env:
          SHARED_TOOLING_STORE: ${{ steps.tools-evidence.outputs.store }}
        uses: ./.github/actions/retain-failure-evidence
        with:
          name: ic-auth-rust-tools-${{ matrix.os }}-${{ github.run_attempt }}
          temp-root: ${{ steps.tools-evidence.outputs.temp }}
          repository-root: ${{ steps.tools-evidence.outputs.consumer }}
      - name: Download verified Rust-tool failure evidence by exact ID
        if: ${{ !cancelled() && steps.tools-evidence-upload.outputs.artifact-id != '' }}
        id: tools-evidence-download
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_REPOSITORY: ${{ github.repository }}
          EVIDENCE_RUN: ${{ github.run_id }}
          EVIDENCE_ARTIFACT: ${{ steps.tools-evidence-upload.outputs.artifact-id }}
          EVIDENCE_DIGEST: ${{ steps.tools-evidence-upload.outputs.artifact-digest }}
        run: bash scripts/ci/download-evidence.sh "$EVIDENCE_REPOSITORY" "$EVIDENCE_RUN" "$EVIDENCE_ARTIFACT" "$EVIDENCE_DIGEST" "$GITHUB_WORKSPACE/target/tools-evidence-downloaded"
      - name: Verify uploaded Rust-tool failure bytes
        env:
          EXPECTED_EVIDENCE: ${{ steps.tools-evidence.outputs.expected }}
        run: |
          cd target/tools-evidence-downloaded
          mkdir payload
          tar -xzf evidence.tar.gz -C payload
          cd payload
          bash "$GITHUB_WORKSPACE/scripts/ci/verify-evidence-checksums.sh" "$EXPECTED_EVIDENCE"
          test ! -e .tools/rust/unrelated-cache
          test ! -e rust-unrelated
      - name: Validate
        run: make ci
      - name: Archive retained Testkit setup evidence
        if: ${{ failure() && !cancelled() }}
        run: |
          if [[ -e .tools/testkit-server || -L .tools/testkit-server ]]; then
            evidence_dir="$(mktemp -d target/portable-fixtures/testkit-setup.XXXXXX)"
            bash scripts/ci/archive-evidence.sh "$PWD/$evidence_dir/server-evidence.tar.gz" \
              "$PWD" .tools/testkit-server
          fi
      - name: Retain failed validation evidence
        if: ${{ failure() && !cancelled() }}
        uses: ./.github/actions/retain-failure-evidence
        with:
          name: ic-auth-failure-${{ matrix.os }}-${{ github.run_attempt }}
          temp-root: ${{ github.workspace }}/target
          repository-root: ${{ github.workspace }}
