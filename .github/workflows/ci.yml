name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      VALIDATION_LOG_DIR: ${{ github.workspace }}/target/portable-fixtures/validation
      TMPDIR: ${{ github.workspace }}/target/portable-fixtures
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Prepare retained evidence directories
        run: mkdir -p target/portable-fixtures target/browser-client
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: packages/client/.nvmrc
          package-manager-cache: false
      - name: Prepare selected client package manager and locked dependencies
        run: |
          selected_npm="$(node --input-type=module -e 'import manifest from "./packages/client/package.json" with {type:"json"}; console.log(manifest.packageManager.slice(4))')"
          npm install --global "npm@$selected_npm" --registry=https://registry.npmjs.org --ignore-scripts --no-audit --no-fund
          make install-client-dependencies 2>&1 | tee target/browser-client/npm-preparation.log
          make client-tools-check
      - name: Prepare the repository-selected Rust toolchain
        run: rustup show active-toolchain
      - name: Install reviewed tools and prepare the selected dependency cache
        run: |
          bash scripts/dev/ci-tools.sh install
          bash scripts/dev/ci-tools.sh check
          printf '%s\n' "$GITHUB_WORKSPACE/.tools/host/bin" \
            "$GITHUB_WORKSPACE/.tools/ic/bin" "$GITHUB_WORKSPACE/.tools/rust/bin" >> "$GITHUB_PATH"
          make fetch
      - name: Qualify Rust-tool setup and check failure collection
        id: tools-evidence
        run: bash scripts/ci/test-tools-evidence.sh
      - name: Upload the qualified Rust-tool failure evidence
        id: tools-evidence-upload
        uses: ./.github/actions/retain-failure-evidence
        with:
          name: ic-auth-rust-tools-${{ matrix.os }}-${{ github.run_attempt }}
          temp-root: ${{ steps.tools-evidence.outputs.temp }}
          repository-root: ${{ steps.tools-evidence.outputs.consumer }}
      - name: Download that exact Rust-tool failure artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ steps.tools-evidence-upload.outputs.artifact-id }}
          path: ${{ github.workspace }}/target/tools-evidence-downloaded
          merge-multiple: true
      - name: Verify uploaded Rust-tool failure bytes
        env:
          EXPECTED_EVIDENCE: ${{ steps.tools-evidence.outputs.expected }}
        run: |
          cd target/tools-evidence-downloaded
          mkdir payload
          tar -xzf evidence.tar.gz -C payload
          cd payload
          bash "$GITHUB_WORKSPACE/scripts/ci/verify-evidence-checksums.sh" "$EXPECTED_EVIDENCE"
          test ! -e .tools/rust/unrelated-cache
      - name: Validate
        run: make ci
      - name: Retain failed validation evidence
        if: ${{ failure() && !cancelled() }}
        uses: ./.github/actions/retain-failure-evidence
        with:
          name: ic-auth-failure-${{ matrix.os }}-${{ github.run_attempt }}
          temp-root: ${{ github.workspace }}/target
          repository-root: ${{ github.workspace }}
