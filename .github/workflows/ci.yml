name: Auth CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Workflow and secret checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./vendor/toko-tooling/.github/actions/cache-tool-downloads
      - name: Prepare pinned CI tools
        run: |
          for tool in actionlint shellcheck gitleaks; do
            perl scripts/ci/setup.pl bash vendor/toko-tooling/scripts/ci/install-ci-tool.sh "$tool" --install-dir "$RUNNER_TEMP/auth-ci-tools" \
              2>&1 | tee "$RUNNER_TEMP/tools-$tool.log"
          done
          echo "$RUNNER_TEMP/auth-ci-tools" >> "$GITHUB_PATH"
      - uses: ./vendor/toko-tooling/.github/actions/cache-tool-downloads
        with:
          mode: save
      - name: Validate workflow
        run: actionlint -color .github/workflows/ci.yml 2>&1 | tee "$RUNNER_TEMP/tools-actionlint-check.log"
      - name: Scan complete Git history once
        run: gitleaks git --redact=100 --no-banner --no-color --log-level error 2>&1 | tee "$RUNNER_TEMP/tools-gitleaks-check.log"
      - name: Retain security failure evidence
        if: failure()
        uses: ./vendor/toko-tooling/.github/actions/retain-failure-evidence
        with:
          name: auth-security-${{ github.run_attempt }}
          temp-root: ${{ runner.temp }}
          repository-root: ${{ github.workspace }}
          compact-successful-tools: 'true'

  native:
    name: Native contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
      VALIDATION_REPOSITORY_ROOT: ${{ github.workspace }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Prepare validation logs
        id: validation-logs
        run: |
          mkdir -p "$RUNNER_TEMP/auth-validation"
          echo "directory=auth-validation" >> "$GITHUB_OUTPUT"
          echo "VALIDATION_LOG_DIR=$RUNNER_TEMP/auth-validation" >> "$GITHUB_ENV"
      - name: Prepare repository Rust toolchain
        # Rustup installs the channel/components from rust-toolchain.toml before
        # the common-tools action computes its compiler-specific cache key.
        run: perl scripts/ci/setup.pl rustup show active-toolchain 2>&1 | tee "$RUNNER_TEMP/tools-rustup.log"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: runner.os == 'Linux'
        with:
          node-version: 24.21.0
      - uses: ./vendor/toko-tooling/.github/actions/prepare-common-tools
        with:
          cache: 'true'
          cache-save: 'true'
      - name: Prepare locked dependencies
        run: |
          perl scripts/ci/setup.pl cargo fetch --locked 2>&1 | tee "$RUNNER_TEMP/tools-cargo-product-fetch.log"
          perl scripts/ci/setup.pl cargo fetch --locked --manifest-path qualification/Cargo.toml 2>&1 | tee "$RUNNER_TEMP/tools-cargo-qualification-fetch.log"
      - name: Admit tooling and run native contracts
        run: |
          bash vendor/toko-tooling/scripts/ci/run-validation-targets.sh --fail-fast \
            test-product test-qualification
      - name: Check focused Auth library test builds
        if: runner.os == 'Linux'
        run: |
          for features in issuer-stable,ed25519-verification receiver-stable,ed25519-verification receiver-stable,certified-verification; do
            cargo check --locked -p ic-auth --lib --tests --features "$features"
          done
      - name: Prepare Wasm compiler target
        if: runner.os == 'Linux'
        run: perl scripts/ci/setup.pl rustup target add wasm32-unknown-unknown 2>&1 | tee "$RUNNER_TEMP/tools-rustup-wasm.log"
      - name: Check formatting, strict lint, Rustdoc and Wasm libraries
        if: runner.os == 'Linux'
        run: |
          bash vendor/toko-tooling/scripts/ci/run-validation-targets.sh --fail-fast \
            fmt-check lint-protocol lint-certified-qualification lint-wire-qualification \
            lint-host doc-protocol check-protocol-wasm
      - name: Prepare locked browser dependencies
        if: runner.os == 'Linux'
        run: perl scripts/ci/setup.pl npm ci --prefix packages/client --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/tools-npm-client.log"
      - name: Verify fixtures, browser client and Wire interoperability
        if: runner.os == 'Linux'
        run: |
          bash vendor/toko-tooling/scripts/ci/run-validation-targets.sh --fail-fast \
            verify-fixtures check-client-generated test-client qualify-wire-browser
      - name: Retain failure evidence
        if: failure()
        uses: ./vendor/toko-tooling/.github/actions/retain-failure-evidence
        with:
          name: auth-ci-${{ matrix.os }}-${{ github.run_attempt }}
          validation-log-directory: ${{ steps.validation-logs.outputs.directory }}
          temp-root: ${{ runner.temp }}
          repository-root: ${{ github.workspace }}
          compact-successful-tools: 'true'
