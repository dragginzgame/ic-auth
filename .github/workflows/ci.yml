name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      VALIDATION_LOG_DIR: ${{ github.workspace }}/target/portable-fixtures/validation
      TMPDIR: ${{ github.workspace }}/target/portable-fixtures
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Prepare retained evidence directories
        run: mkdir -p target/portable-fixtures
      - name: Prepare the repository-selected Rust toolchain
        run: rustup show active-toolchain
      - name: Install reviewed tools and prepare the selected dependency cache
        run: |
          make install-tools
          make tools-check
          printf '%s\n' "$GITHUB_WORKSPACE/.tools/host/bin" \
            "$GITHUB_WORKSPACE/.tools/ic/bin" "$GITHUB_WORKSPACE/.tools/rust/bin" >> "$GITHUB_PATH"
          make fetch
      - name: Validate
        run: make ci
      - name: Retain failed validation evidence
        if: ${{ failure() && !cancelled() }}
        uses: ./.github/actions/retain-failure-evidence
        with:
          name: ic-auth-failure-${{ matrix.os }}-${{ github.run_attempt }}
          temp-root: ${{ github.workspace }}/target
          repository-root: ${{ github.workspace }}
