[workspace]
members = ["crates/ic-auth", "crates/ic-auth-protocol-types", "crates/ic-auth-wire"]
exclude = ["qualification"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license-file = "LICENSE.md"

[workspace.dependencies]
# Production
ic-auth-protocol-types = { version = "0.43.0", path = "crates/ic-auth-protocol-types" }
ic-platform = { version = "0.34.15", default-features = false }
ic-platform-types = { version = "0.21.2", default-features = false }
ic-wire = "0.25.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
# Tests and tooling
toko-tooling = "=0.45.15"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"
