[workspace]
members = [
    # Production packages
    "crates/ic-auth",
    # Tests and tooling packages
    "crates/ic-auth-backend-conformance",
    "crates/ic-auth-feature-unification",
    "crates/ic-auth-protocol-types",
    "crates/ic-auth-qualification",
    "crates/ic-auth-qualification-canister",
    "crates/ic-auth-qualification-contracts",
    "crates/ic-auth-qualification-fixtures",
    "crates/ic-auth-tooling",
    "crates/ic-auth-wire",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dragginzgame/ic-auth"

[workspace.dependencies]
# Engine
# Changelog : releases/engine/CHANGELOG.md
ic-auth = { version = "0.35.10", path = "crates/ic-auth" }
ic-auth-backend-conformance = { version = "0.35.10", path = "crates/ic-auth-backend-conformance" }
ic-auth-feature-unification = { version = "0.35.10", path = "crates/ic-auth-feature-unification" }
ic-auth-qualification = { version = "0.35.10", path = "crates/ic-auth-qualification" }
ic-auth-qualification-canister = { version = "0.35.10", path = "crates/ic-auth-qualification-canister" }
ic-auth-qualification-contracts = { version = "0.35.10", path = "crates/ic-auth-qualification-contracts" }
ic-auth-qualification-fixtures = { version = "0.35.10", path = "crates/ic-auth-qualification-fixtures" }
ic-auth-tooling = { version = "0.35.10", path = "crates/ic-auth-tooling" }

# Protocol
# Changelog : releases/protocol/CHANGELOG.md
ic-auth-protocol-types = { version = "0.36.0", path = "crates/ic-auth-protocol-types" }
ic-auth-wire = { version = "0.36.0", path = "crates/ic-auth-wire" }

# Production dependencies
# Types owns canonical identities; Platform supplies crypto and native IC adapters.
# Passive protocol, default and session-only graphs need no facade or runtime.
ic-platform = { version = "0.27.0", default-features = false }
ic-platform-types = { version = "0.18.0", default-features = false }
# Host generation uses the lock-selected runtime and diagnostic callback.
ic-wire = "0.18.0"
leb128 = "0.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
sha2 = "0.10"
thiserror = "2"

# Tests and tooling only
clap = { version = "4", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
dhat = "0.3.3"
# Adversarial feature trigger only; production and test crypto APIs use Platform.
ed25519-dalek = { version = "3.0", default-features = false }
ic-build = { version = "0.81.0", default-features = false }
ic-host-fs = { version = "0.76.1", default-features = false }
ic-host-process = { version = "0.76.1", default-features = false }
ic-metrics = { version = "0.29.0", default-features = false }
ic-platform-runtime = { version = "0.20.0", default-features = false }
ic-storage = "0.70.0"
ic-testkit = { version = "0.95.0", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
toko-tooling = "=0.36.0"

[workspace.metadata.ic-auth]
# Executable features are source-owned recovery inputs, not library features.
release-editor-features = ["cli"]

[workspace.lints.rust]
unsafe_code = "forbid"
