[workspace]
members = [
    "crates/ic-auth",
    "crates/ic-auth-protocol-types",
    "crates/ic-auth-tooling",
    "crates/ic-auth-wire",
]
exclude = ["qualification"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license-file = "LICENSE.md"
readme = "README.md"
repository = "https://github.com/dragginzgame/ic-auth"

[workspace.dependencies]
# Engine
# Changelog : releases/engine/CHANGELOG.md
ic-auth = { version = "0.39.1", path = "crates/ic-auth" }
ic-auth-tooling = { version = "0.39.1", path = "crates/ic-auth-tooling" }

# Protocol
# Changelog : releases/protocol/CHANGELOG.md
ic-auth-protocol-types = { version = "0.39.2", path = "crates/ic-auth-protocol-types" }
ic-auth-wire = { version = "0.39.2", path = "crates/ic-auth-wire" }

# External product and local test/tooling dependencies
clap = { version = "4", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
dhat = "0.3.3"
ic-build = { version = "0.83.0", default-features = false }
ic-host-fs = { version = "0.76.1", default-features = false }
ic-platform = { version = "0.31.0", default-features = false }
ic-platform-types = { version = "0.19.0", default-features = false }
ic-storage = "0.73.4"
ic-wire = "0.21.0"
leb128 = "0.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.11.1"
thiserror = "2"
toko-tooling = "=0.39.17"

[workspace.metadata.ic-auth]
# Executable features are source-owned recovery inputs, not library features.
release-editor-features = ["cli"]

[workspace.lints.rust]
unsafe_code = "forbid"
