[workspace]
members = [
    # Tests and tooling packages
    "apps/qualification/canister",
    "apps/qualification/contracts",
    "apps/qualification/feature-unification",
    "apps/qualification/runner",
    "apps/tooling",
    # Production packages
    "crates/ic-auth",
    "crates/ic-auth-protocol-types",
    "crates/ic-auth-wire",
]
resolver = "3"

[workspace.package]
version = "0.12.1"
edition = "2024"
rust-version = "1.91.0"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dragginzgame/ic-auth"

[workspace.dependencies]
# Production dependencies
ic-auth = { path = "crates/ic-auth" }
ic-auth-protocol-types = { version = "0.12.1", path = "crates/ic-auth-protocol-types" }
ic-auth-wire = { version = "0.12.1", path = "crates/ic-auth-wire" }
# Platform owns Principal and imported signature code; other crypto identities stay upstream.
# Empty defaults keep protocol, portable and session consumers free of IC runtime.
ic-platform = { version = "0.5", default-features = false }
ic-wire = "0.5"
leb128 = "0.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_cbor = "0.11"
sha2 = "0.10"
thiserror = "2"

# Tests and tooling only
clap = { version = "4", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
# Adversarial feature trigger only; production and test crypto APIs use Platform.
ed25519-dalek = { version = "2.2", default-features = false }
ic-auth-qualification-contracts = { path = "apps/qualification/contracts" }
ic-build = "0.62"
ic-host-fs = { version = "0.62", default-features = false }
ic-host-process = { version = "0.62", default-features = false }
ic-memory = "0.50"
ic-testkit = "0.62"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
