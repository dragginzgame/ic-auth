[workspace]
members = [
    # Tests and tooling packages
    "apps/qualification/canister",
    "apps/qualification/contracts",
    "apps/qualification/runner",
    "apps/tooling",
    # Production packages
    "crates/ic-auth",
    "crates/ic-auth-protocol-types",
    "crates/ic-auth-wire",
]
resolver = "3"

[workspace.package]
version = "0.9.1"
edition = "2024"
rust-version = "1.91.0"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dragginzgame/ic-auth"

[workspace.dependencies]
# Production dependencies
# Portable Ed25519 verification uses Dalek without IC certificates or BLS.
# Keep verifier support crates aligned with the IC signature stack (Auth #65).
curve25519-dalek = { version = "4.1.3", default-features = false }
ed25519-dalek = { version = "2.2", default-features = false }
ic-auth = { path = "crates/ic-auth" }
ic-auth-protocol-types = { version = "0.9.1", path = "crates/ic-auth-protocol-types" }
ic-auth-wire = { version = "0.9.1", path = "crates/ic-auth-wire" }
# Platform #16: published key/hash APIs are not exposed yet.
ic-canister-sig-creation = "1.3.1"
# Platform #17: signature storage also needs AsHashTree, RbTree and Hash.
ic-certification = "3.2"
ic-platform = { version = "0.1.9", default-features = false }
# Platform #18: retain upstream verification until a qualified API is published.
ic-signature-verification = "0.3"
# Platform #18: native test signing and the certified verifier share this identity.
ic-verify-bls-signature = { version = "0.6", default-features = false, features = ["alloc"] }
ic-wire = "0.4"
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa"] }
leb128 = "0.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_cbor = "0.11"
sha2 = "0.10"
thiserror = "2"

# Tests and tooling only
ic-auth-qualification-contracts = { path = "apps/qualification/contracts" }
ic-build = "0.17"
ic-cdk = "0.20.3"
ic-host-fs = { version = "0.27", default-features = false }
ic-host-process = { version = "0.27", default-features = false }
ic-memory = "0.48"
ic-testkit = "0.54"
tokio = { version = "1", features = ["rt-multi-thread"] }

[workspace.lints.rust]
unsafe_code = "forbid"
