[package]
autotests = false
name = "ic-auth-host-conformance"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
description = "Installed IC Auth rollback, certified-root and volatile-loss qualification"
publish = false

[package.metadata.toko-tooling.loc]
category = "tests"

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[dev-dependencies]
ic-auth = { workspace = true, features = ["certified-issuer-verification"] }
ic-auth-host-fixture.workspace = true
ic-auth-protocol-types.workspace = true
ic-auth-wire.workspace = true
ic-build.workspace = true
ic-host-artifacts.workspace = true
ic-host-fs.workspace = true
ic-host-process.workspace = true
ic-platform = { workspace = true, features = ["certificate-construction", "canister-signature-authentication", "certificate-fixture-signing"] }
ic-testkit.workspace = true
ic-wire.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
toko-tooling.workspace = true

[[test]]
name = "installed"
path = "tests/host_installed.rs"

[[test]]
name = "http"
path = "tests/host_http.rs"

[lints]
workspace = true
