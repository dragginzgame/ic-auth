[workspace]
members = [
    "ic-auth-backend-conformance",
    "ic-auth-feature-unification",
    "ic-auth-qualification",
    "ic-auth-qualification-canister",
    "ic-auth-qualification-contracts",
    "ic-auth-qualification-fixtures",
]
resolver = "3"

[workspace.package]
version = "0.36.1"
edition = "2024"
rust-version = "1.99.1"
license-file = "../LICENSE.md"
readme = "../README.md"
repository = "https://github.com/dragginzgame/ic-auth"

[workspace.dependencies]
# Product packages, consumed through the normal source owners.
ic-auth = { version = "0.39.4", path = "../crates/ic-auth" }
ic-auth-protocol-types = { version = "0.39.2", path = "../crates/ic-auth-protocol-types" }
ic-auth-wire = { version = "0.39.2", path = "../crates/ic-auth-wire" }

# Qualification-only packages; private versions do not follow product releases.
ic-auth-backend-conformance = { version = "0.36.1", path = "ic-auth-backend-conformance" }
ic-auth-feature-unification = { version = "0.36.1", path = "ic-auth-feature-unification" }
ic-auth-qualification = { version = "0.36.1", path = "ic-auth-qualification" }
ic-auth-qualification-canister = { version = "0.36.1", path = "ic-auth-qualification-canister" }
ic-auth-qualification-contracts = { version = "0.36.1", path = "ic-auth-qualification-contracts" }
ic-auth-qualification-fixtures = { version = "0.36.1", path = "ic-auth-qualification-fixtures" }

# External qualification dependencies
ed25519-dalek = { version = "3.0", default-features = false }
ic-entropy = "0.1.0"
ic-host-fs = { version = "0.76.1", default-features = false }
ic-host-process = { version = "0.76.1", default-features = false }
ic-metrics = { version = "0.29.0", default-features = false }
ic-platform = { version = "0.31.0", default-features = false }
ic-platform-runtime = { version = "0.21.0", default-features = false }
ic-storage = "0.73.6"
ic-testkit = { version = "0.101.0", default-features = false }
ic-wire = "0.21.0"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
toko-tooling = "=0.39.18"

[workspace.lints.rust]
unsafe_code = "forbid"

# The installed scaling fixture verifies 100,000 distinct signed seed records.
# Optimize curve arithmetic only; retain the test profile's debug/overflow checks
# and leave the measured canister's release profile unchanged.
[profile.test.package.curve25519-dalek]
opt-level = 3
