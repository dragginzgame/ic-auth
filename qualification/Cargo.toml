[workspace]
members = [
    "ic-auth-certified-conformance",
    "ic-auth-ed25519-conformance",
    "ic-auth-host-conformance",
    "ic-auth-host-fixture",
    "ic-auth-wire-conformance",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license-file = "../LICENSE.md"

[workspace.dependencies]
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["legacy_compatibility"] }
ic-auth = { path = "../crates/ic-auth" }
ic-auth-host-fixture = { path = "ic-auth-host-fixture" }
ic-auth-protocol-types = { path = "../crates/ic-auth-protocol-types" }
ic-auth-wire = { path = "../crates/ic-auth-wire" }
ic-build = "0.87.3"
ic-host-artifacts = "0.80.1"
ic-host-fs = "0.80.1"
ic-platform = { version = "0.33.7", default-features = false }
ic-platform-runtime = { version = "0.22.5", default-features = false }
ic-testkit = "0.106.0"
ic-wire = "0.24.1"
serde = "1.0.229"
sha2 = "0.11.1"
tokio = "1.54.1"
toko-tooling = "=0.44.4"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"
