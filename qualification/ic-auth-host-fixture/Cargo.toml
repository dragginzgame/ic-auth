[package]
name = "ic-auth-host-fixture"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
description = "Qualification-only volatile Auth transaction and loss canister"
publish = false

[package.metadata.toko-tooling.loc]
category = "tests"

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
ic-auth = { workspace = true, features = ["issuer-memory", "receiver-memory", "ed25519-verification", "certified-verification"] }
ic-auth-wire.workspace = true
ic-platform = { workspace = true, features = ["certificate-construction", "ed25519"] }
ic-platform-runtime = { workspace = true, features = ["entrypoint-macros", "system-raw"] }

[dependencies]
ic-auth-protocol-types.workspace = true
ic-wire.workspace = true
serde = { workspace = true, features = ["derive"] }
sha2.workspace = true

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
