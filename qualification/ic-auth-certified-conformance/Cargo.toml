[package]
name = "ic-auth-certified-conformance"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
description = "Independent root ECDSA and issuer BLS fixtures for Auth verification"
publish = false

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
receiver-memory = ["ic-auth/receiver-memory"]
ed25519-comparison = ["ic-auth/ed25519-verification"]

[dev-dependencies]
ic-auth = { workspace = true, features = ["certified-verification"] }
ic-auth-protocol-types.workspace = true
ic-auth-wire.workspace = true
ic-platform = { workspace = true, features = ["certification-cbor", "ic-protocol-fixtures"] }
sha2.workspace = true
toko-tooling.workspace = true

[lints]
workspace = true
