title = "IC Auth repository secret scanning"

[extend]
useDefault = true

# Extend only the generic heuristic; retain every provider-specific rule.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Source-file SHA-256 entries in the checked release-input inventory"
condition = "AND"
paths = ['''^release-validation\.json$''']
regexTarget = "line"
regexes = ['''^\s*"[A-Za-z0-9_./-]+\.(rs|sh|md|ts|json)": "[0-9a-f]{64}",?\s*$''']

[[rules.allowlists]]
description = "Generated escaped package identifiers in Mermaid dependency edges"
condition = "AND"
paths = ['''^docs/stack\.md$''']
regexTarget = "line"
regexes = ['''^\s*p_[a-z0-9_]+ --> p_[a-z0-9_]+\s*$''']
