# Production packages
[package]
name = "ic-auth"
version = "0.39.2"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme.workspace = true
repository.workspace = true
description = "Portable authentication, delegation proof verification and local session machinery"
publish = ["crates-io"]

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
# Certificate capabilities admit Platform's upstream Candid/IC0 dependencies.
# Auth keeps Wire transport and host-owned runtime/admission policy.
default = []
portable-signature-verification = ["dep:ic-platform", "ic-platform/ed25519"]
chain-key-verification = ["dep:ic-platform", "ic-platform/ecdsa"]
canister-signature-preparation = [
    "dep:ic-platform",
    "ic-platform/canister-sig-creation",
    "ic-platform/certification-cbor",
]
sessions = ["dep:serde", "dep:serde_bytes", "dep:ic-wire"]
session-restore = ["sessions"]
persistent = ["session-restore", "dep:ic-storage"]
certified-proof-verification = ["canister-signature-verification", "chain-key-verification"]
canister-signature-verification = [
    "dep:ic-platform",
    "ic-platform/canister-sig-creation",
    "ic-platform/certification",
    "ic-platform/signature-verification",
]

[dependencies]
ic-auth-protocol-types.workspace = true
ic-platform = { workspace = true, optional = true }
ic-platform-types = { workspace = true, features = ["principal-self-authenticating"] }
ic-storage = { workspace = true, optional = true }
ic-wire = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_bytes = { workspace = true, optional = true }
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
ic-platform = { workspace = true, features = ["bls", "ecdsa", "ed25519", "ic-protocol-fixtures"] }
ic-storage = { workspace = true, features = ["test-support"] }
ic-wire.workspace = true
leb128.workspace = true
serde.workspace = true
serde_bytes.workspace = true
toko-tooling.workspace = true

[lints]
workspace = true
