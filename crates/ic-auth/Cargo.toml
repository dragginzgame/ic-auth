[package]
name = "ic-auth"
version = "0.46.1"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
description = "Canonical authentication, proof verification and bounded volatile receiver/issuer state"
publish = false

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
issuer-memory = [
    "dep:ic-wire",
    "dep:serde",
    "ic-auth-protocol-types/principal-self-authenticating",
]
receiver-memory = ["dep:ic-wire", "dep:serde"]
ed25519-verification = [
    "dep:ic-platform",
    "ic-platform/ed25519",
    "ic-auth-protocol-types/principal-self-authenticating",
]
certified-issuer-verification = ["dep:ic-platform", "ic-platform/signature-verification"]
root-delegation-verification = ["dep:ic-platform", "ic-platform/ecdsa"]
certified-verification = [
    "certified-issuer-verification",
    "root-delegation-verification",
    "ic-auth-protocol-types/principal-self-authenticating",
]

[dependencies]
ic-auth-protocol-types.workspace = true
ic-platform = { workspace = true, optional = true }
ic-wire = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
sha2.workspace = true

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
