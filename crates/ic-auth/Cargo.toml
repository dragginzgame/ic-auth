[package]
name = "ic-auth"
version = "0.48.6"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
description = "Canonical authentication, proof verification and bounded receiver/issuer state with optional stable upgrade checkpoints"
repository = "https://github.com/dragginzgame/ic-auth"
documentation = "https://docs.rs/ic-auth"
readme = "README.md"
publish = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
issuer-stable = ["issuer-memory", "dep:ic-storage", "ic-auth-protocol-types/stable-records"]
receiver-stable = ["receiver-memory", "dep:ic-storage", "ic-auth-protocol-types/stable-records"]
issuer-memory = [
    "dep:ic-wire",
    "dep:serde",
    "ic-auth-protocol-types/principal-self-authenticating",
]
receiver-memory = ["dep:ic-wire", "dep:serde"]
ed25519-verification = [
    "dep:ic-platform",
    "ic-platform/ed25519",
    "ic-auth-protocol-types/principal-self-authenticating",
]
certified-issuer-verification = ["dep:ic-platform", "ic-platform/canister-signature-authentication"]
root-delegation-verification = ["dep:ic-platform", "ic-platform/ecdsa"]
certified-verification = [
    "certified-issuer-verification",
    "root-delegation-verification",
    "ic-auth-protocol-types/principal-self-authenticating",
]

[dependencies]
ic-auth-protocol-types.workspace = true
ic-platform = { workspace = true, optional = true }
ic-storage = { workspace = true, optional = true }
ic-wire = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
sha2.workspace = true

[dev-dependencies]
toko-tooling.workspace = true

# Both the public integration target and private interruption tests use this fixture directory.
[[test]]
name = "receiver_memory"
path = "src/receiver_memory/publication_faults/tests/receiver_memory.rs"

[lints]
workspace = true
