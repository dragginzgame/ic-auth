[package]
name = "ic-auth"
version = "0.42.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
description = "Canonical authentication claims, bounded request policy and optional proof verification"
publish = false

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
ed25519-verification = [
    "dep:ic-platform",
    "ic-platform/ed25519",
    "ic-auth-protocol-types/principal-self-authenticating",
]
certified-issuer-verification = ["dep:ic-platform", "ic-platform/signature-verification"]

[dependencies]
ic-auth-protocol-types.workspace = true
ic-platform = { workspace = true, optional = true }
sha2.workspace = true

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
