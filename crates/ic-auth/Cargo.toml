[package]
name = "ic-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description = "Application authentication encoding and optional IC signature, token and local session machinery"
publish = ["crates-io"]

[features]
# Encoding and local sessions do not require Candid. There is no Candid feature.
# Only the upstream certified-signature capabilities bring it in transitively.
default = []
portable-signature-verification = ["dep:curve25519-dalek", "dep:ed25519-dalek"]
chain-key-verification = ["dep:k256"]
canister-signature-preparation = [
    "dep:ic-canister-sig-creation",
    "dep:ic-certification",
    "dep:serde",
    "dep:serde_bytes",
    "dep:serde_cbor",
]
sessions = ["dep:serde", "dep:serde_cbor"]
session-restore = ["sessions"]
token-verification = ["canister-signature-verification", "chain-key-verification"]
canister-signature-verification = [
    "dep:ic-canister-sig-creation",
    "dep:ic-certification",
    "dep:ic-signature-verification",
    "dep:leb128",
    "dep:serde",
    "dep:serde_bytes",
    "dep:serde_cbor",
]

[dependencies]
curve25519-dalek = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
ic-auth-protocol-types.workspace = true
ic-canister-sig-creation = { workspace = true, optional = true }
ic-certification = { workspace = true, optional = true }
ic-signature-verification = { workspace = true, optional = true }
k256 = { workspace = true, optional = true }
leb128 = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_bytes = { workspace = true, optional = true }
serde_cbor = { workspace = true, optional = true }
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
ic-verify-bls-signature.workspace = true

[lints]
workspace = true
