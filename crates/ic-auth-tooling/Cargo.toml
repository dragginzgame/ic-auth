# Tests and tooling packages
[package]
name = "ic-auth-tooling"
version = "0.35.10"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "IC Auth client-contract generation and external Cargo-lock admission"
publish = false

[package.metadata.shared-tooling.loc]
category = "build_tooling"

[package.metadata.shared-tooling.loc.paths]
"benches" = "benchmarks"

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[dependencies]
clap.workspace = true
ic-auth-wire = { workspace = true, features = ["typescript"] }
ic-build.workspace = true
ic-host-fs.workspace = true
serde_json.workspace = true

[dev-dependencies]
dhat.workspace = true
ic-auth = { workspace = true, features = ["sessions", "portable-signature-verification"] }
ic-auth-protocol-types.workspace = true
ic-host-fs = { workspace = true, features = ["test-support"] }
ic-platform = { workspace = true, features = ["ed25519"] }
toko-tooling.workspace = true

[[bench]]
name = "canonical_allocations"
harness = false

[[bench]]
name = "retry_allocations"
harness = false

[lints]
workspace = true
