[package]
name = "ic-auth-wire"
version = "0.48.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
description = "Bounded credential, session admission, read and logout Wire contracts"
repository = "https://github.com/dragginzgame/ic-auth"
documentation = "https://docs.rs/ic-auth-wire"
readme = "README.md"
publish = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
typescript = ["ic-wire/derive", "ic-wire/platform-types"]

[dependencies]
ic-auth-protocol-types.workspace = true
ic-wire.workspace = true
serde.workspace = true

[dev-dependencies]
toko-tooling.workspace = true

[[example]]
name = "generate"
required-features = ["typescript"]

[lints]
workspace = true
